<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIPELITA DESA - Sistem Informasi Kelayakan Rumah Warga (RTLH/RLH)</title>
    <meta name="description" content="Sistem Informasi Geospasial Pendataan Kelayakan Rumah Tinggal Warga (RTLH/RLH) untuk Pemerintah Desa berdasarkan Standar Teknis BPS & Kementerian PUPR." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0284c7" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-container"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('SIPELITA Service Worker aktif:', reg.scope);
          }).catch((err) => {
            console.warn('SIPELITA Service Worker gagal didaftarkan:', err);
          });
        });
      }
    </script>
  </body>
</html>
